<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Exemplo de arrays</h1>
    <p>Criando um array e adicionando novos itens no inicio do array</p>
    <script>
        // Criando o array de pokemons
        let listaPokemons = ["Pikachu", "Charmander", "Bulbasaur"];

        //Adicionar o pokemon no array
        listaPokemons.unshift("Squirtle");

        console.log(listaPokemons);

        listaPokemons.unshift("Mewtwo", "Eevee");

        console.log(listaPokemons)
    </script>
</body>
</html>
