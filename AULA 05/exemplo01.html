<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Criando um exemplo de procedimento
        function exibirMensagem(){
            alert("Ola mundo");
        }

        function calcularSubtracao() {
            let num1 = parseInt(prompt("Digite um número"));
            let num2 = parseInt(prompt("Digite outro número"))

            let total = num1 - num2;
            console.log(`O resultado é: ${total}`)
        }

        function calcularSoma(valor1, valor2) {
            return valor1 + valor2;
        }

        //chamando ou invocando a função exibirMensagem
        exibirMensagem();

        //Chamar a função calcularSubtracao
        calcularSubtracao();

        //Chamar a função calcularSoma
        console.log(`A SOMA ${calcularSoma(7,7)}`)
    </script>
</body>
</html>
