 <!DOCTYPE html>
 <html lang="pt-br">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo prático - do while</title>
 </head>
 <body>
    <h1>Exemplo prático - do while</h1>
    <p>Exibindo números de 299 a 401 no console</p>
    <script>
        //declarando e inicializando o contador em 299
        let i = 299;
        do{
            console.log(`Número: ${i}`)
            i++
        } while(i<=401);

    </script>
 </body>
 </html>
